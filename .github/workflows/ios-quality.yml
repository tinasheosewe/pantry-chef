name: iOS Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Unit tests and coverage
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # The app is developed with Xcode 26.3. Use it while the runner image still
          # carries it; otherwise stay on the image's default Xcode.
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          fi
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      # Builds the checked-in PantryChef.xcodeproj (no project generation), runs
      # PantryChefTests on an iPhone simulator and applies the coverage floor.
      - name: Unit tests and coverage gate
        run: bash Scripts/ci/run_quality.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pantrychef-test-results
          path: .artifacts/test-results
          if-no-files-found: ignore
