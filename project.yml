name: PantryChef
options:
  bundleIdPrefix: com.tboya.pantrychef
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_CFBundleDisplayName: "Pantry Chef"
    DEVELOPMENT_TEAM: WZ7SK754J9
    CODE_SIGN_STYLE: Automatic

packages:
  swift-realtime-openai:
    url: https://github.com/m1guelpf/swift-realtime-openai.git
    branch: main

targets:
  PantryChef:
    type: application
    platform: iOS
    sources:
      - PantryChef
    dependencies:
      - package: swift-realtime-openai
        product: RealtimeAPI
    info:
      path: PantryChef/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UILaunchScreen:
          BackgroundColor: LaunchBG
        NSCameraUsageDescription: "Pantry Chef needs camera access to scan barcodes and receipts"
        NSSpeechRecognitionUsageDescription: "Pantry Chef uses speech recognition for voice commands in cook mode"
        NSMicrophoneUsageDescription: "Pantry Chef needs microphone access for voice input"
        NSPhotoLibraryUsageDescription: "Pantry Chef needs photo library access to import recipe photos"

  PantryChefTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PantryChefTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PantryChef
